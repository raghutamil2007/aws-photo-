services:
  - type: web
    name: event-photos
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 18.18.0
      # Option 1: Paste full Firebase Service Account JSON string
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      # Option 2 (or use individual keys):
      # - key: FIREBASE_PROJECT_ID
      # - key: FIREBASE_CLIENT_EMAIL
      # - key: FIREBASE_PRIVATE_KEY
      # - key: FIREBASE_STORAGE_BUCKET
